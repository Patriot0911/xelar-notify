services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBIT_VHOST}
      - RABBIT_VHOST=${RABBIT_VHOST}

      - API_PASSWORD=${RABBIT_API_PASSWORD}
      - API_USER=${RABBIT_API_USER}

      - RECEIVER_PASSWORD=${RABBIT_RECEIVER_PASSWORD}
      - RECEIVER_USER=${RABBIT_RECEIVER_USER}

      - DISCORD_PASSWORD=${RABBIT_DISCORD_PASSWORD}
      - DISCORD_USER=${RABBIT_DISCORD_USER}

      - TELEGRAM_PASSWORD=${RABBIT_TELEGRAM_PASSWORD}
      - TELEGRAM_USER=${RABBIT_TELEGRAM_USER}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: |
        rabbitmq-diagnostics ping && \
        rabbitmqctl list_users | grep -q "${RABBIT_DISCORD_USER}" && \
        rabbitmqctl list_users | grep -q "${RABBIT_TELEGRAM_USER}" && \
        rabbitmqctl list_users | grep -q "${RABBIT_RECEIVER_USER}" && \
        rabbitmqctl list_users | grep -q "${RABBIT_API_USER}"
      interval: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # migrate:
  #   build:
  #     context: .
  #     args:
  #       APP: api
  #   command: ["node", "dist/migrate"]
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: on-failure

  api:
    build:
      context: .
      args:
        APP: api
    ports:
      - "${API_PORT}:${API_PORT}"
    env_file: .env
    depends_on:
      # migrate:
      #   condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  webhook-receiver:
    build:
      context: .
      args:
        APP: webhook-receiver
    ports:
      - "${WEBHOOK_RECEIVER_PORT}:${WEBHOOK_RECEIVER_PORT}"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      args:
        APP: discord-bot
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      args:
        APP: telegram-bot
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  rabbitmq_data: