name: Build and Deploy Backend

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { app: api,                 dockerfile: Dockerfile,          context: .,         build_args: "APP=api" }
          - { app: notification-worker, dockerfile: Dockerfile,          context: .,         build_args: "APP=notification-worker" }
          - { app: webhook-receiver,    dockerfile: Dockerfile,          context: .,         build_args: "APP=webhook-receiver" }
          - { app: discord-bot,         dockerfile: Dockerfile,          context: .,         build_args: "APP=discord-bot" }
          - { app: migrate,             dockerfile: Dockerfile.migrate,  context: .,         build_args: "" }
          - { app: rabbitmq,            dockerfile: rabbitmq/Dockerfile, context: ./rabbitmq, build_args: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/patriot0911/xelar-notify/${{ matrix.app }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /app/xelar/xelar-back
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
            docker image prune -f