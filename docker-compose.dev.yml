services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBIT_VHOST}
      - RABBIT_VHOST=${RABBIT_VHOST}

      - API_PASSWORD=${RABBIT_API_PASSWORD}
      - API_USER=${RABBIT_API_USER}

      - RECEIVER_PASSWORD=${RABBIT_RECEIVER_PASSWORD}
      - RECEIVER_USER=${RABBIT_RECEIVER_USER}

      - DISCORD_PASSWORD=${RABBIT_DISCORD_PASSWORD}
      - DISCORD_USER=${RABBIT_DISCORD_USER}

      - WORKER_PASSWORD=${RABBIT_WORKER_PASSWORD}
      - WORKER_USER=${RABBIT_WORKER_USER}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBIT_PORT}:5672"
      - "15672:15672"

volumes:
  pgdata_dev:
  redis_data:
  rabbitmq_data: